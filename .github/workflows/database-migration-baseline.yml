name: Database Migration Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/models/**"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/requirements.txt"
      - ".github/workflows/database-migration-baseline.yml"

permissions:
  contents: read

jobs:
  migration-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantforge
          POSTGRES_PASSWORD: quantforge_test
          POSTGRES_DB: quantforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantforge -d quantforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://quantforge:quantforge_test@localhost:5432/quantforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Confirm Alembic configuration loads
        working-directory: backend
        run: alembic history
      - name: Require a reviewed, versioned baseline before upgrade
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          revisions = sorted(Path("alembic/versions").glob("*.py"))
          if not revisions:
              raise SystemExit(
                  "No versioned Alembic migration exists yet. "
                  "Generate and review the static initial baseline before enabling upgrades."
              )
          print("Versioned migration files:", *(p.name for p in revisions), sep="\n- ")
          PY
      - name: Upgrade an empty PostgreSQL database
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration matches SQLAlchemy metadata
        working-directory: backend
        run: alembic check

      - name: Verify downgrade and upgrade cycle
        working-directory: backend
        run: |
          alembic downgrade 20261007_0001
          alembic upgrade head

      - name: Verify expected tables exist
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          import os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          expected = {
              "users", "user_sessions", "portfolios", "trades", "strategies",
              "strategy_runs", "broker_tokens", "notifications", "deployments",
              "subscriptions", "audit_logs", "orders", "positions", "execution_fills", "cash_ledger_entries", "risk_limits",
          }

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  rows = await conn.execute(text(
                      "SELECT tablename FROM pg_tables WHERE schemaname = 'public'"
                  ))
                  actual = set(rows.scalars())
                  missing = expected - actual
                  if missing:
                      raise SystemExit(f"Missing expected tables: {sorted(missing)}")
                  print(f"Verified {len(expected)} expected application tables.")
              await engine.dispose()

          asyncio.run(main())
          PY
